<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'none'" />
  <title>Deadlock Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <img src="icon.png" alt="" />
      </div>
      <div>
        <div class="brand-name">DEADLOCK<span>COACH</span></div>
      </div>
    </div>
    <nav class="nav" aria-label="Разделы">
      <div class="nav-group">Моя игра</div>
      <button class="nav-item" data-view="home"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span><span>Главная</span></button>
      <button class="nav-item" data-view="coach"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3.5V2M12 22v-1.5M3.5 12H2M22 12h-1.5"/></svg></span><span>Тренер</span></button>
      <button class="nav-item" data-view="growth"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg></span><span>Ошибки</span></button>
      <button class="nav-item" data-view="matches"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M7.5 9h9M7.5 13h9M7.5 17h5"/></svg></span><span>Мои матчи</span></button>
      <button class="nav-item" data-view="myheroes"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.2 8.3-7 10-3.8-1.7-7-5-7-10V6z"/><path d="M9 11.5l2 2 4-4"/></svg></span><span>Мои герои</span></button>
      <div class="nav-group" id="topN-label">Мета · топ-50</div>
      <button class="nav-item" data-view="meta"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg></span><span>Мета героев</span></button>
      <button class="nav-item" data-view="prep"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5-9.5 9.5H5v-5z"/><path d="M12.5 6.5l5 5"/></svg></span><span>Перед игрой</span></button>
      <button class="nav-item" data-view="players"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16.5 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.8-1.7-4.8-4-5.6"/></svg></span><span>Про-игроки</span></button>
    </nav>
    <div class="side-foot">
      <button class="nav-item" data-view="settings"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></span><span>Настройки</span></button>
      <div id="account"></div>
    </div>
  </aside>

  <main class="main">
    <div class="progress" id="progress" hidden>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>
    <section class="view" id="view-overview" hidden></section>
    <section class="view" id="view-coach" hidden></section>
    <section class="view" id="view-growth" hidden></section>
    <section class="view" id="view-meta" hidden></section>
    <section class="view" id="view-prep" hidden></section>
    <section class="view" id="view-camp" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="format.js"></script>
  <script src="icons.js"></script>
  <script src="charts.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
