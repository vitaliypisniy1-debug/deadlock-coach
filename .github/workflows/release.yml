# Сборка Deadlock Coach в .exe на серверах GitHub.
#
# Как выпускается версия:
#  • Поднять "version" в package.json (например 0.9.1), положить описание
#    в release-notes/v0.9.1.md и отправить изменения в main. GitHub увидит,
#    что релиза v0.9.1 ещё нет, соберёт .exe и сам создаст релиз.
#    (Так делает Claude.)
#  • Или на сайте: Releases → «Draft a new release» → тег v0.9.1 → Publish.
# Через 5–10 минут к релизу прикрепятся установщик и переносная версия,
# а установленные программы сами предложат обновиться.
name: Сборка релиза

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: # ручной запуск во вкладке Actions — пробная сборка без релиза

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Какую версию собираем
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
            npm version "${TAG#v}" --no-git-tag-version --allow-same-version
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            TAG="v$(node -p "require('./package.json').version")"
            if [ "${{ github.event_name }}" = "push" ]; then
              if gh release view "$TAG" >/dev/null 2>&1; then
                echo "Релиз $TAG уже есть — сборка не нужна (подними version в package.json, чтобы выпустить новую)."
                echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
              else
                echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Версия: $TAG"

      - name: Адрес репозитория для обновлений
        if: steps.plan.outputs.build == 'true'
        shell: bash
        run: node -e "const f='package.json';const p=require('./'+f);p.updateRepo=process.env.GITHUB_REPOSITORY;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Зависимости и Electron
        if: steps.plan.outputs.build == 'true'
        run: npm install --no-audit --no-fund

      - name: Тесты
        if: steps.plan.outputs.build == 'true'
        run: npm test

      - name: Сборка .exe
        if: steps.plan.outputs.build == 'true'
        run: npx --yes electron-builder@25.1.8 --win nsis portable --publish never

      - name: Создать релиз и прикрепить файлы
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES="release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "Deadlock Coach ${TAG#v}" --notes-file "$NOTES"
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "Deadlock Coach ${TAG#v}" --notes "Новая версия Deadlock Coach."
            fi
          fi
          gh release upload "$TAG" dist/*.exe --clobber

      - name: Сохранить сборку (для ручного запуска)
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deadlock-coach-windows
          path: dist/*.exe
