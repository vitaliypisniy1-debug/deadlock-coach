<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'none'" />
  <title>Deadlock Coach</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <img src="icon.png" alt="" />
      </div>
      <div>
        <div class="brand-name">DEADLOCK<span>COACH</span></div>
      </div>
    </div>
    <nav class="nav" aria-label="Разделы">
      <div class="nav-group">Моя игра</div>
      <button class="nav-item" data-view="home"><span class="ico" data-icon="house" aria-hidden="true"></span><span>Главная</span></button>
      <button class="nav-item" data-view="coach"><span class="ico" data-icon="target" aria-hidden="true"></span><span>Тренер</span></button>
      <button class="nav-item" data-view="growth"><span class="ico" data-icon="trending-up" aria-hidden="true"></span><span>Ошибки</span></button>
      <button class="nav-item" data-view="matches"><span class="ico" data-icon="scroll-text" aria-hidden="true"></span><span>Мои матчи</span></button>
      <button class="nav-item" data-view="myheroes"><span class="ico" data-icon="shield-check" aria-hidden="true"></span><span>Мои герои</span></button>
      <div class="nav-group" id="topN-label">Мета и подготовка</div>
      <button class="nav-item" data-view="meta"><span class="ico" data-icon="chart-column" aria-hidden="true"></span><span>Мета героев</span></button>
      <button class="nav-item" data-view="prep"><span class="ico" data-icon="swords" aria-hidden="true"></span><span>Перед игрой</span></button>
      <button class="nav-item" data-view="codex"><span class="ico" data-icon="book-open" aria-hidden="true"></span><span>Справочник контрпиков</span></button>
      <button class="nav-item" data-view="players"><span class="ico" data-icon="users" aria-hidden="true"></span><span>Про-игроки</span></button>
    </nav>
    <div class="side-foot">
      <button class="nav-item" data-view="settings"><span class="ico" data-icon="settings" aria-hidden="true"></span><span>Настройки</span></button>
      <div id="account"></div>
    </div>
  </aside>

  <main class="main">
    <div class="progress" id="progress" hidden>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>
    <section class="view" id="view-overview" hidden></section>
    <section class="view" id="view-coach" hidden></section>
    <section class="view" id="view-growth" hidden></section>
    <section class="view" id="view-meta" hidden></section>
    <section class="view" id="view-prep" hidden></section>
    <section class="view" id="view-codex" hidden></section>
    <section class="view" id="view-camp" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/echarts.min.js"></script>
  <script src="vendor/lucide-icons.js"></script>
  <script src="format.js"></script>
  <script src="icons.js"></script>
  <script src="charts.js"></script>
  <script src="charts-ec.js"></script>
  <script src="map.js"></script>
  <script src="heroSlug.js"></script>
  <script src="timeAgo.js"></script>
  <script src="banners.js"></script>
  <script src="crest.js"></script>
  <script src="fx.js"></script>
  <script src="app.js"></script>
</body>
</html>
